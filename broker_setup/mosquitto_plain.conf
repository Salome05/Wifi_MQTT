# =============================================================================
# Module 1 & 2: Mosquitto Local Broker Configuration (Plaintext TCP Port 1883)
# =============================================================================
# How to run on your PC:
#   mosquitto -c broker_setup/mosquitto_plain.conf -v
#
# Why do we need this config file?
#   Since Mosquitto v2.0+, running `mosquitto` without a config file binds ONLY
#   to `localhost` (127.0.0.1), which blocks external devices like your ESP32!
# =============================================================================

# Listen on Port 1883 across all network interfaces (0.0.0.0)
listener 1883 0.0.0.0

# Allow clients to connect without a username/password for Module 1 & 2
allow_anonymous true

# Log all connection events, subscriptions, and published messages to console
log_type all
log_dest stdout
connection_messages true
log_timestamp true

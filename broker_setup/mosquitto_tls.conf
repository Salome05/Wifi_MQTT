# =============================================================================
# Module 3 & 4: Mosquitto Local Broker Configuration (TLS / MQTTS Port 8883)
# =============================================================================
# How to run on your PC (from the project root directory):
#   mosquitto -c broker_setup/mosquitto_tls.conf -v
#
# Prerequisite:
#   You must first generate `ca.crt`, `server.crt`, and `server.key` inside
#   `broker_setup/certs/` using the OpenSSL commands in LAB_GUIDE.md!
# =============================================================================

# Listen on standard MQTTS port 8883 across all network interfaces (0.0.0.0)
listener 8883 0.0.0.0

# -----------------------------------------------------------------------------
# Server-Side TLS Certificates (Generated in Module 3 via OpenSSL)
# -----------------------------------------------------------------------------
cafile broker_setup/certs/ca.crt
certfile broker_setup/certs/server.crt
keyfile broker_setup/certs/server.key

# Enforce TLS v1.2 or higher
tls_version tlsv1.2

# -----------------------------------------------------------------------------
# Client Authentication Mode
# -----------------------------------------------------------------------------
# Standard Module 4 (Server-Side TLS):
#   The ESP32 verifies the broker's certificate, and connects anonymously.
allow_anonymous true
require_certificate false

# BONUS CHALLENGE (Mutual TLS / mTLS):
#   Uncomment the two lines below so the broker ALSO demands a valid X.509
#   client certificate (`client.crt`) signed by `ca.crt` from the ESP32!
# require_certificate true
# use_identity_as_username true

# Verbose logging for debugging TLS handshakes in class
log_type all
log_dest stdout
connection_messages true
log_timestamp true
